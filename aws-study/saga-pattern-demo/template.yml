AWSTemplateFormatVersion: 2010-09-09
Description: >-
  saga-pattern-demo (Node.js 22.x / AWS SDK v3 modernized / SNS notification extension)

Parameters:
 stateMachineName:
   Description: State Machine Name
   Type: String
   Default: BookingStateMachine

Transform:
- AWS::Serverless-2016-10-31

Globals:
  Function:
    Tracing: Active
    Handler: app.lambdaHandler
    Runtime: nodejs22.x
    MemorySize: 128
    Timeout: 200

Resources:

  LambdaFunctionRole:
      Type: "AWS::IAM::Role"
      Properties:
          Path: "/"
          ManagedPolicyArns:
              - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
              - "arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess"
              - "arn:aws:iam::aws:policy/AWSStepFunctionsReadOnlyAccess"
          Policies:
            - PolicyName: DemoLambdaRuntime
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - dynamodb:GetItem
                      - dynamodb:PutItem
                    Resource: [
                      !GetAtt carBookingsTable.Arn,
                      !GetAtt flightBookingsTable.Arn,
                      !GetAtt hotelBookingsTable.Arn
                    ]
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement:
              -
                Sid: "AllowLambdaServiceToAssumeRole"
                Effect: "Allow"
                Action:
                  - "sts:AssumeRole"
                Principal:
                  Service:
                    - "lambda.amazonaws.com"

  # Booking Functions
  BookCarFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt LambdaFunctionRole.Arn
      CodeUri: src/functions/BookCar/
      Environment:
        Variables:
          CAR_BOOKINGS_TABLE_NAME: !Ref carBookingsTable

  BookFlightFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt LambdaFunctionRole.Arn
      CodeUri: src/functions/BookFlight/
      Environment:
        Variables:
          FLIGHT_BOOKINGS_TABLE_NAME: !Ref flightBookingsTable

  BookHotelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt LambdaFunctionRole.Arn
      CodeUri: src/functions/BookHotel/
      Environment:
        Variables:
          HOTEL_BOOKINGS_TABLE_NAME: !Ref hotelBookingsTable

  # Cancel Booking Functions (compensating transactions)
  CancelCarFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt LambdaFunctionRole.Arn
      CodeUri: src/functions/CancelCar/
      Environment:
        Variables:
          CAR_BOOKINGS_TABLE_NAME: !Ref carBookingsTable

  CancelFlightFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt LambdaFunctionRole.Arn
      CodeUri: src/functions/CancelFlight/
      Environment:
        Variables:
          FLIGHT_BOOKINGS_TABLE_NAME: !Ref flightBookingsTable

  CancelHotelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt LambdaFunctionRole.Arn
      CodeUri: src/functions/CancelHotel/
      Environment:
        Variables:
          HOTEL_BOOKINGS_TABLE_NAME: !Ref hotelBookingsTable

  StatusCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt LambdaFunctionRole.Arn
      CodeUri: src/functions/StatusCheck/
      Events:
        Api:
          Type: Api
          Properties:
            Path: /Status
            Method: POST

  # SNS Notification (original extension - not in upstream sample)
  NotificationTopic:
    Type: AWS::SNS::Topic

  # State Machine (saga orchestrator)
  BookingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Ref stateMachineName
      DefinitionUri: src/statesmachine/saga_pattern.asl.yaml
      Tracing:
        Enabled: true
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: POST
      DefinitionSubstitutions:
        BookCarFunctionArn: !GetAtt BookCarFunction.Arn
        BookFlightFunctionArn: !GetAtt BookFlightFunction.Arn
        BookHotelFunctionArn: !GetAtt BookHotelFunction.Arn
        CancelCarFunctionArn: !GetAtt CancelCarFunction.Arn
        CancelFlightFunctionArn: !GetAtt CancelFlightFunction.Arn
        CancelHotelFunctionArn: !GetAtt CancelHotelFunction.Arn
        NotificationTopicArn: !Ref NotificationTopic

      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref BookCarFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BookFlightFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BookHotelFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CancelCarFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CancelFlightFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CancelHotelFunction
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationTopic.TopicName

  hotelBookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: tripId
          AttributeType: S
      KeySchema:
        - AttributeName: tripId
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  carBookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: tripId
          AttributeType: S
      KeySchema:
        - AttributeName: tripId
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  flightBookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: tripId
          AttributeType: S
      KeySchema:
        - AttributeName: tripId
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  NotificationTopicArn:
    Description: "SNS Topic ARN for booking notifications"
    Value: !Ref NotificationTopic

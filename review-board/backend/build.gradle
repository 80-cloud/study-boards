plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.reviewboard'
version = '0.0.1-SNAPSHOT'

// ★S軸：依存脆弱性スキャン(CI/Trivy)で検出された High/Critical を 0 件に保つための
// バージョン上書き。Spring Boot 3.5.14 で大半が解消するが、BOM 管理版より新しい
// 修正版が必要なものは spring-boot-dependencies の version property を上書きする。
// 各値は Trivy が示した fixed version に対応（更新時は CI の検出結果で再確認すること）。
ext['tomcat.version'] = '10.1.55'              // CVE-2026-41293 ほか tomcat 系
ext['spring-framework.version'] = '6.2.11'     // CVE-2025-41249
ext['spring-security.version'] = '6.5.9'       // CVE-2026-22732 / CVE-2025-41248
ext['postgresql.version'] = '42.7.11'          // CVE-2026-42198

java {
	// Java 25 (LTS)。技術スタック.md §2-1 / §8。foojay resolver により
	// ローカル JDK が 21 でも Gradle が JDK 25 を自動取得してコンパイルする。
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// メール通知（#175・過疎化対策）。SMTP は env 駆動・app.mail.enabled で有効化（既定 false）。
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// 4 ゴールデンシグナルの収集（母 §3-1）。http.server.requests（Latency/Traffic/Errors）と
	// Hikari/JVM（Saturation）を Micrometer が Actuator 経由で /actuator/prometheus に公開する。
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// ★S軸の中核：RBAC + 認可（SecurityConfig）
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// JWT (HS256, HttpOnly Cookie 認証。技術スタック.md §2-4)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// C-6 TOTP 二要素認証（#235・任意の MFA）。Apache-2.0・無料。シークレット生成/コード検証/QR を提供。
	implementation 'dev.samstevens.totp:totp:1.7.1'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// AWS SDK v2 S3（成果物スクショ。ローカルは MinIO を S3 互換として使う。
	// 重い Netty を持ち込まず url-connection-client を使う）
	implementation platform('software.amazon.awssdk:bom:2.31.78')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// 結合テストは Testcontainers PostgreSQL（テスト計画書 §4。本番同等で方言差を避ける）
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	// SEC-8 アップロードは本番同等の MinIO（S3 互換）で結合テストする。
	testImplementation 'org.testcontainers:minio'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// env-var 駆動の application.yml（${DATABASE_PASSWORD} 等、fail-fast）を test fork に継承。
	// 必要な key のみ allow-list で渡し、機密が test heap に乗らないようにする。
	// DOCKER_API_VERSION: Testcontainers(docker-java) が daemon の対応上限を超える API
	// バージョンを要求して 400 になる環境向けの安全弁（設定時のみ伝播。未設定なら無影響）。
	['DATABASE_URL', 'DATABASE_USERNAME', 'DATABASE_PASSWORD',
	 'JWT_SECRET', 'JWT_COOKIE_SECURE', 'SPRING_PROFILES_ACTIVE',
	 'DOCKER_API_VERSION'].each { key ->
		def value = System.getenv(key)
		if (value != null) {
			environment key, value
		}
	}
	// Testcontainers(docker-java) は新しめの API バージョンを要求し、Docker Desktop の対応上限を
	// 超えると /info が 400 になって "Could not find a valid Docker environment" で失敗する。
	// docker-java が直接読む system property `api.version` で保守的な版に固定して回避する。
	// 既定 1.44 は daemon 最小要件(1.40)以上で広く互換。新しい daemon に合わせたい場合は
	// DOCKER_API_VERSION env で上書き可能。
	systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
	finalizedBy jacocoTestReport
}

// JaCoCo カバレッジ。レポート生成＋回帰床ゲート（母 M-9・#251）。
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// カバレッジ回帰床（#251）。満点目標ではなく「静かに下がるのを防ぐ床」。
// 現状（INSTRUCTION 83% / BRANCH 61%）に余裕を持たせて flaky 化を避ける。
// テスト拡充に伴い将来引き上げてよい。
jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.75
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.50
			}
		}
	}
}

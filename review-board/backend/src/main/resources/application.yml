spring:
  application:
    name: review-board
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/reviewboard}
    username: ${DATABASE_USERNAME:reviewboard}
    # パスワードはデフォルト値を持たせない（未設定なら起動失敗＝fail-fast。機密ハードコード禁止）
    password: ${DATABASE_PASSWORD}
  jpa:
    # スキーマの正は Flyway。Hibernate には作らせない（none）。
    # 全エンティティが出揃ったら validate に切り替えて drift を検出する（M-14 の精神。TODO）。
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # SEC-8：multipart 段でサイズを弾く（サービス側 max-upload-bytes と二重防御）。
      max-file-size: 5MB
      max-request-size: 6MB
  # メール通知（#175）。host 未設定なら JavaMailSender は生成されない（=送信しない）。
  # 機密（user/password）はデフォルトを持たせず env 駆動（SEC-9）。
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        # health は監視プローブ用（SecurityConfig で permitAll）。
        # metrics/prometheus は運用観測（SecurityConfig で ROLE_TEACHER 限定）。
        include: health,info,metrics,prometheus
  health:
    # mail は best-effort の付帯機能（#175）。SMTP 到達性で liveness を落とさない
    # （health はアプリ稼働の可否のみを示す。SMTP 障害でプローブを失敗させない）。
    mail:
      enabled: false
  metrics:
    tags:
      application: review-board
    distribution:
      # 主要 API の P95/P99 を出せるようヒストグラムを有効化（P-1 性能目標と対）。
      # P95/P99 は bucket から histogram_quantile 相当で算出する（Prometheus 標準）。
      percentiles-histogram:
        http.server.requests: true

# ログ：1リクエストを横断追跡できるよう MDC の requestId/userId を出力する（母 §3-1）。
# dev は読みやすいプレーンログ＋[requestId,userId]。prod は下の prod プロファイルで JSON 化。
logging:
  pattern:
    correlation: "[%X{requestId:-},%X{userId:-}] "

# アプリ固有設定（env 駆動。.env.example 参照）
app:
  # アプリの表示名（メール署名など外向き文面の単一ソース。env で上書き可＝完全リネームの仕込み）。
  name: ${APP_NAME:レビューラボ}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: 900       # 15 分（短命 access）
    refresh-ttl-seconds: 1209600  # 14 日（refresh、DB rotation）
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  # 認証の継ぎ目（外部連携A/組み込みB）。既定 false＝Cookie 認証のみ（現状と同一）。
  # ON で Authorization: Bearer ヘッダ認証も受理（公開API/M2M/widget 向け）。
  auth:
    bearer-enabled: ${AUTH_BEARER_ENABLED:false}
  # 組み込みの継ぎ目（モデルB）。既定 'none'＝iframe 拒否（X-Frame-Options: DENY 維持）。
  # 顧客オリジンを設定すると CSP frame-ancestors で限定的に埋め込みを解放する。
  embedding:
    frame-ancestors: ${EMBEDDING_FRAME_ANCESTORS:'none'}
  # メール通知（#175）。既定 false＝no-op（dev/CI/SMTP 未設定でも安全）。本番で MAIL_ENABLED=true。
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@review-board.local}
    base-url: ${PUBLIC_ORIGIN:}
  # 初期管理者の bootstrap（デプロイ直後の「最初の1人」を作る。未設定＝何もしない・冪等）。
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    cohort-name: ${BOOTSTRAP_ADMIN_COHORT:管理}
  cors:
    # 単一オリジン（後方互換）。複数許可は allowed-origins（カンマ区切り）を使う。
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5175}
    # 連携/組み込みの継ぎ目：顧客オリジンを増やす場合はここにカンマ区切りで列挙。
    # 未指定時は allowed-origin にフォールバック（既定は単一オリジンのまま）。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGIN:http://localhost:5175}}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9002}
      bucket: ${S3_BUCKET:review-board}
      region: ${S3_REGION:ap-northeast-1}
      # 機密はデフォルト値を持たせず env 駆動（SEC-9）。ローカルは docker-compose の MinIO 既定と一致。
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      presign-ttl-seconds: 600          # 表示用 署名 URL の寿命（10 分・短命）
      max-upload-bytes: 5242880         # 5MB（サービス側の二重チェック。下の multipart 上限と対）
  # #218 自動サムネ（demo_url をヘッドレス撮影）。既定 OFF＝test/CI/本番で勝手に Chrome を起動しない。
  # 本番 t3.micro は OOM/SSRF 面を出さないため当面 OFF（有効化は隔離撮影ホスト整備後・ADR 参照）。
  # dev だけ下の dev プロファイルで ON にして検証する。
  thumbnail:
    auto-capture-enabled: ${THUMBNAIL_AUTO_CAPTURE:false}
    chrome-path: ${CHROME_PATH:}
    viewport-width: 1200
    viewport-height: 750
    timeout-ms: 20000                 # Chrome コールドスタート＋ネットワーク取得の余裕（撮影は非同期）

---
# dev プロファイル：自動サムネを ON にし、mac の Chrome を既定パスで使う（env で上書き可）。
spring:
  config:
    activate:
      on-profile: dev
app:
  thumbnail:
    auto-capture-enabled: ${THUMBNAIL_AUTO_CAPTURE:true}
    chrome-path: ${CHROME_PATH:/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}

---
# prod プロファイル（M-5：dev/prod 分離）。
# 本番は機械解析可能な JSON 構造化ログ（ECS 形式）を標準出力に流す。
# MDC の requestId/userId は ECS の構造化フィールドとして自動的に含まれる。
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
# 本番のオブジェクトストレージは AWS S3。endpoint/キーは既定で空にして、
# AWS 既定エンドポイント＋EC2 の IAM ロール（インスタンスプロファイル）で認証する
# （静的キーをサーバに置かない＝SEC-9。infra/iam.tf で S3 権限付与済み）。
# bucket は deploy 時に S3_BUCKET（infra の screenshots バケット名）で指定する。
app:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

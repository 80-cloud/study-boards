# Dependabot：依存の自動更新 PR（#253）。供給網の脆弱性を放置しないための定期更新。
# 更新はまとめて（grouped）週次で出し、PR 洪水を避ける。ラベルは chore。
version: 2
updates:
  # GitHub Actions のワークフローで使う action のバージョン更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - chore
    groups:
      actions:
        patterns:
          - "*"

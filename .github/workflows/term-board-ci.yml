name: term-board CI

# term-board の品質ゲート（要件定義書 §4-2・受入 A-6）。
# 型チェック＋本番ビルドの成功、単体テスト（Vitest）、依存脆弱性 High/Critical 0件を常設で担保する。

on:
  # #525: build-and-audit は必須チェック。全PRで必ず報告される必要があるため
  #       pull_request の paths フィルタを外す（term-board 非対象PRでも term-board を
  #       ビルドして green になり、必須条件が満たされずマージ不可になるデッドロックを防ぐ）。
  pull_request:
  push:
    branches: [main]
    paths:
      - "term-board/**"
      - ".github/workflows/term-board-ci.yml"

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: term-board
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (use .nvmrc = 24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: term-board/.nvmrc
          cache: npm
          cache-dependency-path: term-board/package-lock.json

      - name: Install (clean, reproducible)
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Dependency vulnerability scan (fail on High/Critical)
        run: npm audit --audit-level=high

name: review-board CD build (immutable artifact)

# ============================================================
# #161 CD の「ビルド/アーティファクト」半分（slack-board cd-build.yml のパターンを EC2/jar 向けに移植）。
#
# 役割：テストゲート（./gradlew test）→ 不変アーティファクト（backend jar ＋ frontend dist）を
# コミット SHA タグで発行し、GitHub Actions Artifact として保存する。
#
# 実デプロイ（EC2 への昇格）は別ワークフロー review-board-cd-deploy.yml の手動 dispatch で行う
# （「apply は人間承認」思想＝デプロイ承認ゲート、CLAUDE.md §6/§12）。
#
# slack-board は ECS（ECR image）だが review-board は EC2＋nginx＋jar のため、
# 不変アーティファクトは「jar ＋ 静的ビルド」を SHA で固めたものとする。
# 本番化で remote state / OIDC / S3 アーティファクトバケットに置き換える余地を残す。
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'review-board/backend/**'
      - 'review-board/frontend/**'
      - '.github/workflows/review-board-cd-build.yml'
  workflow_dispatch: {}

concurrency:
  group: rb-cd-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-gate:
    name: テストゲート（gradle test）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: review-board/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: ./gradlew test（テスト緑がデプロイの前提）
        run: ./gradlew test --no-daemon --console=plain

  build-artifact:
    name: 不変アーティファクト発行（jar + dist, SHA タグ）
    needs: test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: SHA タグを解決
        id: meta
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: backend jar をビルド（bootJar）
        working-directory: review-board/backend
        run: ./gradlew bootJar --no-daemon --console=plain

      - name: frontend をビルド（vite build）
        working-directory: review-board/frontend
        run: |
          npm install
          npm run build

      - name: アーティファクトを SHA で固める
        run: |
          set -eu
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p "artifact/$TAG"
          # backend jar（bootJar の実行可能 jar。plain jar が併存する場合は除外）。
          JAR=$(ls review-board/backend/build/libs/*.jar | grep -v -- '-plain.jar' | head -1)
          echo "selected jar: $JAR"
          cp "$JAR" "artifact/$TAG/app.jar"
          # frontend 静的ビルド
          cp -r review-board/frontend/dist "artifact/$TAG/dist"
          # 由来の追跡（どのコミットの成果物か）
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$TAG"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ref=${GITHUB_REF:-}"
          } > "artifact/$TAG/MANIFEST.txt"
          ls -lR "artifact/$TAG" | head -40

      - name: アーティファクトをアップロード（不変・SHA 名）
        uses: actions/upload-artifact@v4
        with:
          name: review-board-${{ steps.meta.outputs.tag }}
          path: artifact/${{ steps.meta.outputs.tag }}/
          retention-days: 30
          if-no-files-found: error

      # AWS 認証とアーティファクトバケットが設定済みなら、S3 にも push（EC2 の deploy.sh が取得）。
      # 未設定（S-2 前）なら GitHub Artifact のみで、以降の step はスキップする。
      # 注意: `if:` 条件で secrets コンテキストは参照不可（startup_failure になる）。
      #       secret は env へ写してから guard step の出力で判定する（cd-deploy と同方式）。
      - name: 前提チェック（CD 認証が無ければ S3 push をスキップ）
        id: guard
        env:
          AWS_KEY: ${{ secrets.RB_CD_AWS_ACCESS_KEY_ID }}
          ARTIFACTS_BUCKET: ${{ vars.RB_ARTIFACTS_BUCKET }}
        run: |
          if [ -n "${AWS_KEY}" ] && [ -n "${ARTIFACTS_BUCKET}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "RB_CD_AWS_ACCESS_KEY_ID または RB_ARTIFACTS_BUCKET 未設定のため S3 push はスキップ（GitHub Artifact のみ）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: アーティファクトを S3 に push（認証時のみ）
        if: steps.guard.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RB_CD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RB_CD_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-1
          ARTIFACTS_BUCKET: ${{ vars.RB_ARTIFACTS_BUCKET }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          aws s3 sync "artifact/$TAG/" "s3://$ARTIFACTS_BUCKET/$TAG/" --only-show-errors
          echo "::notice title=pushed to S3::s3://$ARTIFACTS_BUCKET/$TAG/"

      # #212 ドリフト検知：本番にデプロイ済みの SHA（cd-deploy が記録したマーカー）と、いま発行した
      # アーティファクトの SHA を比較する。乖離していれば「未デプロイの滞留」を警告し、見逃しを防ぐ。
      # ★手動承認ゲートは維持（ここでは自動デプロイしない）。警告のみでビルドは失敗させない。
      - name: 本番デプロイとのドリフト検知（未デプロイの滞留を警告）
        if: steps.guard.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RB_CD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RB_CD_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-1
          ARTIFACTS_BUCKET: ${{ vars.RB_ARTIFACTS_BUCKET }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # マーカーが無ければ「未デプロイ（初回）」として扱う。
          DEPLOYED="(none)"
          if aws s3 cp "s3://$ARTIFACTS_BUCKET/deployed/current.txt" deployed-current.txt --only-show-errors 2>/dev/null; then
            DEPLOYED="$(tr -d '[:space:]' < deployed-current.txt)"
          fi
          if [ "$DEPLOYED" = "$TAG" ]; then
            echo "## ✅ 本番は最新（ドリフトなし）" >> "$GITHUB_STEP_SUMMARY"
            echo "本番デプロイ済み SHA = 最新アーティファクト SHA = \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⚠️ 未デプロイのアーティファクトがあります"
              echo ""
              echo "| | SHA |"
              echo "|---|---|"
              echo "| 本番デプロイ済み | \`$DEPLOYED\` |"
              echo "| 最新アーティファクト（このビルド） | \`$TAG\` |"
              echo ""
              echo "**本番反映するには cd-deploy を手動 dispatch してください**（sha=\`$TAG\` / confirm=\`deploy\`）。"
              echo "手動承認ゲートは維持しているため、マージだけでは本番に反映されません。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=deploy pending::本番=$DEPLOYED / 最新=$TAG。cd-deploy で sha=$TAG を昇格してください（マージ＝本番反映ではありません）。"
          fi

      - name: 次の手動デプロイで使う SHA を表示
        run: |
          echo "::notice title=artifact ready::SHA=${{ steps.meta.outputs.tag }} を review-board-cd-deploy の sha 入力に渡して昇格する"

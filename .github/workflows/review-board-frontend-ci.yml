name: review-board Frontend CI (lint, test & build)

# ============================================================
# 共通設計方針：CI は Fail Fast（lint→test→build）。backend CI と並列のフロント版。
# review-board/frontend の lint（ESLint）→ unit test（Vitest）→ build（Vite）を回す。
# ============================================================

on:
  pull_request:
    paths:
      - 'review-board/frontend/**'
      - '.github/workflows/review-board-frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'review-board/frontend/**'
      - '.github/workflows/review-board-frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: rb-fe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: review-board/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: review-board/frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      # Fail Fast：lint（軽量）→ test（中量・vitest）→ build（重量）。
      - name: Lint
        run: npm run lint

      # Issue #484：unit test + coverage 閾値（vite.config.js test.coverage.thresholds）。
      - name: Unit Test + Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
